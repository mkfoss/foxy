version: "2"
run:
  tests: true
linters:
  enable:
    - goconst
    - gocritic
    - misspell
    - revive
    - unparam
  settings:
    errcheck:
      check-blank: true
      exclude-functions:
        - (*os.File).Close
        - (*os.File).Remove
        - os.RemoveAll
        - (io.Closer).Close
        - (*github.com/mkfoss/foxy.Dbf).Close
        - (*github.com/mkfoss/foxy/pkg/core.CdxFile).Close
        - (github.com/mkfoss/foxy.Opener).Close
        - (*github.com/mkfoss/foxy/internal/mockfiler.MockFiler).Close
    revive:
      rules:
        - name: exported
          disabled: true
        - name: package-comments
          disabled: true
    staticcheck:
      checks:
        - all
        - -ST*
        - -QF*
  exclusions:
    generated: lax
    rules:
      - linters:
          - goconst
        path: _test\.go
    paths:
      - third_party$
      - builtin$
      - examples$
issues:
  max-issues-per-linter: 0
  max-same-issues: 0
formatters:
  exclusions:
    generated: lax
    paths:
      - third_party$
      - builtin$
      - examples$
